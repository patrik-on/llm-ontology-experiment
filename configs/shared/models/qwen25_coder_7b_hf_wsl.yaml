model:
  status: "eval_aligned_v3"
  provider: "huggingface"
  name: "${LLM_ONTOLOGY_MODELS_ROOT}/huggingface/Qwen2.5-Coder-7B-Instruct"
  tokenizer_name: "${LLM_ONTOLOGY_MODELS_ROOT}/huggingface/Qwen2.5-Coder-7B-Instruct"
  hub_id: "Qwen/Qwen2.5-Coder-7B-Instruct"
  architecture: "causal_lm"
  language_focus: "code"
  primary_use: "fine_tuning"

runtime:
  # v3 records carry the full matrix contract (testing ~2k tokens, refactoring context
  # units up to ~6k in + out). scripts/datasets/prepare_v3_eval_aligned.py DROPS records over
  # this limit, so the trainer never truncates a prompt or a gold answer (v2 used 2048 and
  # truncated 30 % of refactoring examples; reproduce v2 from Git history + adapter snapshots).
  max_seq_length: 8192
  load_in_4bit: true
  torch_dtype: "float16"
  device_map: "auto"
  trust_remote_code: true

notes:
  - "Hugging Face fine-tuning config (v3); evaluation HF inference uses configs/evaluation/eval_models_v2_only.yaml."
  - "WSL2/Linux model config for LoRA/QLoRA fine-tuning."
  - "Gradient checkpointing is enabled by peft.prepare_model_for_kbit_training."
  - "Requires CUDA-enabled PyTorch and bitsandbytes in WSL."
