experiment:
  name: "b2_testing_onto"
  description: "JUnit Jupiter test bodies in the testing-matrix JSON contract with the project-ontology block (eval-aligned v3_onto, same manifest as v3)"
  model_config: "configs/shared/models/qwen25_coder_7b_hf_wsl.yaml"
  lora_config: "configs/finetuning/lora_config.yaml"

dataset:
  train_file: "data/processed/v3_onto/testing/train.jsonl"
  val_file: "data/processed/v3_onto/testing/val.jsonl"
  # The held-out test for v3 is the evaluation matrices themselves; readiness checks need a path.
  test_file: "data/processed/v3_onto/testing/val.jsonl"

output:
  output_dir: "~/experiments/llm-ontology-v3/b2_testing_onto/checkpoints"
  logging_dir: "~/experiments/llm-ontology-v3/b2_testing_onto/logs"
  results_dir: "~/experiments/llm-ontology-v3/b2_testing_onto/results"
  final_adapter_dir: "~/experiments/llm-ontology-v3/b2_testing_onto/checkpoints/final_adapter"

run:
  dry_run: false
  max_train_samples: null
  max_val_samples: null
  max_steps: null
  seed: 42
