runtime:
  environment: wsl
  status: current
  ollama_base_url: http://localhost:11434

collections:
  refactor: refactoring_db
  tests: testing_db
  mixed: mixed
  refactoring_examples: refactoring_examples
  test_examples: test_examples
  software_engineering_literature: literature_db
  ontology_concepts: ontology_concepts
  project_context: project_context

embeddings:
  provider: ollama
  model: bge-m3
  version: runtime_digest
  revision: null
  dimension: 1024
  normalized: true
  batch_size: 16
  base_url: http://localhost:11434
  timeout_seconds: 120
  candidate_status: current_wsl_baseline

llm:
  provider: ollama
  model: qwen2.5-coder:7b
  version: runtime_digest
  base_url: http://localhost:11434
  temperature: 0.0
  top_p: 0.9
  max_tokens: 2048
  seed: 42
  timeout_seconds: 120

vector_store:
  provider: chromadb
  persist_path: data/chroma/ollama_bge_m3
  distance: cosine

ingestion:
  allowed_splits: [train]
  pipeline_version: rag-v2
  literature_max_chars: 1800

retrieval:
  mode: single_collection_rag
  top_k: 5
  max_context_tokens: 12000
  allowed_splits: [train]
  collections: [mixed]
  metadata_filter: {}
  rrf_k: 60
  per_collection_top_k: 5

experiment:
  results_path: experiments/results/ollama_bge_m3.jsonl
  random_seed: 42
