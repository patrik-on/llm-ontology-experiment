experiment:
  name: "multi_rag_qwen25_coder_7b"
  approach: "multi_rag"
  enabled: false

model:
  config: "configs/models/qwen25_coder_7b_ollama.yaml"

retrieval:
  mode: "multi_collection_rag"
  allowed_splits:
    - "train"
  indexes:
    - "testing_db"
    - "refactoring_db"
  fusion: "rrf"
  rrf_k: 60
  per_collection_top_k: 5
  global_top_k: 5
  max_context_tokens: 12000

notes:
  - "No router: every configured disjoint collection is queried in parallel."
  - "Literature is optional and may be added only with an approved retrieval manifest."
  - "Generation uses WSL Ollama at http://localhost:11434."
