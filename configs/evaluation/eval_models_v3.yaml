# Eval-aligned v3 adapters (docs/finetuning/v3_runbook.md). Not wired into the matrices yet:
# switching the FT arms needs the follow-up described in the runbook and a NEW run-id.
inference:
  device_map: "auto"
  torch_dtype: "float16"
  load_in_4bit: true
  bnb_4bit_compute_dtype: "float16"
  bnb_4bit_use_double_quant: true
  bnb_4bit_quant_type: "nf4"
  offload_dir: "~/experiments/llm-ontology/eval_offload"

models:
  - name: "b2_testing_v3"
    type: "lora"
    model_path: "/mnt/c/models/huggingface/Qwen2.5-Coder-7B-Instruct"
    adapter_path: "~/experiments/llm-ontology-v3/b2_testing/checkpoints/final_adapter"

  - name: "b2_refactoring_v3"
    type: "lora"
    model_path: "/mnt/c/models/huggingface/Qwen2.5-Coder-7B-Instruct"
    adapter_path: "~/experiments/llm-ontology-v3/b2_refactoring/checkpoints/final_adapter"

  - name: "b1_shared_v3"
    type: "lora"
    model_path: "/mnt/c/models/huggingface/Qwen2.5-Coder-7B-Instruct"
    adapter_path: "~/experiments/llm-ontology-v3/b1_shared/checkpoints/final_adapter"
