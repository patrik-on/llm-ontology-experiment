name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # tests/repair reads R1 v1 from Git history
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      # Light install: no torch/chromadb. Tests needing them, or Git-ignored
      # local data, are skipped with an explicit reason (see tests/conftest.py).
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]" "tree-sitter>=0.25,<0.27" tree-sitter-java==0.23.5 "pypdf>=5,<7" "rdflib>=7,<8" "pyshacl>=0.30,<0.41"
      - name: Ruff
        run: ruff check src scripts tests
      - name: Pytest
        run: python -m pytest -q -rs
